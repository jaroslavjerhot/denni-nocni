<div id="pageProfile" class="app-page">
  <div class="container-fluid page-container">
    
    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto">

                <h1 class="text-center mb-0" style="font-size: 3rem;">
                    <span style="color: var(--blue-dark);">denní</span><span style="color: var(--blue-middle);">:</span><span style="color: var(--blue-green);">noční</span>
                </h1>
                <!-- <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                </h6> -->
                <h6 class="text-center mb-4 c-blue-darker">
                    <span data-text="titUser"></span>: <span data-text="titCompany"></span> | <span data-text="titDepartment"></span>
                </h6>

                <h2 class="c-blue-darker text-center mb-4" data-text="titPage">
                </h2>

                <!-- Email -->
                <div data-visible="role=Mngr">
                <div class="section-title c-blue-darker">Email</div>
                <input data-dirty id="email" class="form-control" placeholder="Email" data-value="email">
                </div>
                <!-- NAME -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-2">

                        <label class="form-label section-title c-blue-darker mb-0">Titul před</label>

                        <input data-dirty id="prefix" class="form-control" placeholder="Titul před" data-value="prefix">

                    </div>

                    <div class="col-12 col-md-4">

                        <label class="form-label section-title c-blue-darker mb-0">Jméno</label>
                        <input data-dirty id="givenname" class="form-control" placeholder="Jméno" data-value="givenname">

                    </div>

                    <div class="col-12 col-md-4">

                        <label class="form-label section-title c-blue-darker mb-0">Příjmení</label>
                        <input data-dirty id="surname" class="form-control" placeholder="Příjmení" data-value="surname">

                    </div>

                    <div class="col-12 col-md-2">

                        <label class="form-label section-title c-blue-darker mb-0">Titul za</label>

                        <input data-dirty id="suffix" class="form-control" placeholder="Titul za" data-value="suffix">

                    </div>

                </div>

                <!-- sex, shortname, phone -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-2">
                        <label class="form-label section-title  c-blue-darker mb-0">Pohlaví</label>
                        <input data-dirty id="sex" class="form-control" readonly 
                        data-value="strSex" data-action="fPickSex">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label section-title  c-blue-darker mb-0">Zkrácené jméno (cca 5 znaků)</label>
                        <input data-dirty id="shortname" class="form-control"
                            placeholder="Zkrácené jméno pro zobrazování ve směnách (max. 5 znaků)"
                            data-value="shortname">
                    </div>

                    
                    
                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker mb-0">Telefonní číslo</label>
                        <input data-dirty id="phone" class="form-control" placeholder="Telefonní číslo" data-value="phone">
                    </div>

                    

                </div>

                <!-- POSITION -->

                <div class="row g-2 mb-3">
                    
                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker mb-0">Preferovaná pracoviště</label>
                        <input data-dirty id="spotsPicker" class="form-control" readonly 
                        data-value="strSpots" data-action="fPickFavoriteSpots">
                    </div>
                    
                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker mb-0">Pracovní pozice (i doplňkové)</label>
                        <input data-dirty id="positionsPicker" class="form-control" readonly 
                        data-value="strPositions" data-action="fPickFavoritePositions">
                    </div>

                </div>

                

                <!-- DEPUTIES -->
                <div data-visible="role=Mngr">
                <div class="section-title c-blue-darker">Zástupci (mají podobná práva jako vy)</div>
                <!-- <input data-dirty id="deputyPicker" class="form-control" readonly 
                data-value="strDeputies" data-action="fPickDeputyEmployees"> -->
                <textarea data-dirty 
                    id="deputyPicker"
                    class="form-control input-picker"
                    rows="1"
                    readonly
                    data-value="strDeputies" data-action="fPickDeputyEmployees">
                </textarea>
                </div>

                <!-- favorite_ -->
                <div class="section-title c-blue-darker">Oblíbení kolegové/yně (budou preferováni při rozepisování do směn)</div>
                <!-- <input data-dirty id="favoritePicker" class="form-control" readonly 
                data-value="strFavorites" data-action="fPickFavoriteEmployees"> -->

                <textarea data-dirty
                    id="favoritePicker"
                    class="form-control input-picker"
                    rows="1"
                    readonly
                    data-value="strFavorites" data-action="fPickFavoriteEmployees">
                </textarea>
                
                <!-- UNfavorite_ -->
                <div class="section-title c-blue-darker">Neoblíbení kolegové/yně (pokud to bude možné, nebudou vám přiřazováni do směn)</div>
                <!-- <input data-dirty id="unfavoritePicker" class="form-control" readonly 
                data-value="strUnfavorites" data-action="fPickUnfavoriteEmployees"> -->
                <textarea data-dirty
                    id="unfavoritePicker"
                    class="form-control input-picker"
                    rows="1"
                    readonly
                    data-value="strUnfavorites" data-action="fPickUnfavoriteEmployees">
                </textarea>


                
            <!-- BUTTONS -->
            <div class="row mb-3">  </div>
                <div class="row g-2">
                    <div class="col-12 col-md-6">

                        <button type="button" class="btn btn-blue-darker w-100 mb-2" data-action="fSaveUserProfile">
                            Uložit
                        </button>

                    </div>
                    <div class="col-12 col-md-6">
                    <button type="button" class="btn btn-blue-green-white w-100 mb-2" data-action="fGoToPage"> 
                        Zpět bez uložení
                    </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
