<div id="pageRequests" class="app-page">
  <div class="container-fluid page-container">
    
    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto w-none">

                <h1 class="text-center mb-0" style="font-size: 3rem;">
                    <span style="color: var(--blue-dark);">denní</span><span style="color: var(--blue-middle);">:</span><span style="color: var(--blue-green);">noční</span>
                </h1>
                <!-- <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                </h6> -->
                <h6 class="text-center mb-4 c-blue-darker"  data-text="profileTitle2">
                </h6>

                <h2 class="c-blue-darker text-center mb-4" data-text="profileTitle">
                </h2>
                <!-- <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                </h6> -->

        <div class="row g-2 mb-3">

            <div class="col-12 col-md-6">
                <input type="month" id="requestMonth" class="form-control">
            </div>

            <div class="col-12 col-md-6">
                <button type="button" class="btn btn-blue-darker w-100 mb-2" data-action="fRenderRequestsCalendar">
                    Zobrazit měsíc
                </button>
            </div>

        </div>

        <div id="requestCounter" class="text-center mb-3"></div>

        <div class="table-responsive">
            <table class="table table-bordered calendar-table">
                <thead hidden>
                    <tr class="text-center">
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                        <th>Sun</th>
                    </tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>

        <div class="row g-2 mt-3">

            <div class="col-12 col-md-6">
                <button
                    type="button"
                    class="btn btn-royal w-100"
                    onclick="saveRequests()">
                    Save
                </button>
            </div>

            <div class="col-12 col-md-6">
                <a href="dashboard.html" class="btn btn-outline-success w-100">
                    Back
                </a>
            </div>

        </div>

        <div id="msg" class="text-center mt-3"></div>

    </div>

</div>
</div>
</div>
</div>
