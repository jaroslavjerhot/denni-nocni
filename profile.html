<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>denní|noční</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">

</head>

<body>
  <div class="container-fluid page-container">

    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto">

                <h1 class="text-center mb-1" style="font-size: 3rem;">
                    denní|noční
                </h1>
               <h6 class="text-center mb-4">
                    Plánovač pro směnný provoz
                  </h6>

                <h2 class="text-center mb-5">
                    Profil uživatele/lky
                </h2>

                
                <!-- NAME -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-2">

                        <!-- <label class="form-label">
                            Prefix
                        </label> -->

                        <input id="prefix" class="form-control" placeholder="Titul před jménem" data-field="prefix">

                    </div>

                    <div class="col-12 col-md-4">

                        <!-- <label class="form-label">
                            Given name
                        </label> -->

                        <input id="givenname" class="form-control" placeholder="Jméno" data-field="givenname">

                    </div>

                    <div class="col-12 col-md-4">

                        <!-- <label class="form-label">
                            Surname
                        </label> -->

                        <input id="surname" class="form-control" placeholder="Příjmení" data-field="surname">

                    </div>

                    <div class="col-12 col-md-2">

                        <!-- <label class="form-label">
                            Suffix
                        </label> -->

                        <input id="suffix" class="form-control" placeholder="Titul za jménem" data-field="suffix">

                    </div>

                </div>

                <!-- PHONE -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Telefonní číslo
                        </label> -->

                        <input
                            id="phone"
                            class="form-control"
                            placeholder="Telefonní číslo"
                            data-field="phone">

                    </div>

                

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Shortname
                        </label> -->

                        <input id="shortname" class="form-control"
                            placeholder="Zkrácené jméno pro zobrazování ve směnách (max. 5 znaků)"
                            data-field="shortname">

                    </div>

                </div>

                <!-- POSITION -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Position
                        </label> -->

                        <select id="department" class="form-select" data-field="department">
                            <option value="">Vyberte oddělení</option>
                            <option value="ApoBr">VFN-Apolinář</option>
                            <option value="Xxxxx">Jiné</option>
                        </select>

                    </div>
                    
                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Position
                        </label> -->

                        <select id="preferred_room" class="form-select">

                            <option value="">Vyberte preferovaný sál</option>
                            <!-- <option value="p_doc">Primář/ka</option>
                            <option value="doc">Lékař/ka</option> -->
                            <option value="room0">Je mi to jedno</option>
                            <option value="room1">Porodní centrum</option>
                            <option value="room2">2. porodní sál</option>
                            
                        </select>

                    </div>
                </div>
                <div class="row g-2 mb-3">


                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Position
                        </label> -->

                        <select id="pos1" class="form-select">

                            <option value="">Vyberte pracovní pozici</option>
                            <!-- <option value="p_doc">Primář/ka</option>
                            <option value="doc">Lékař/ka</option> -->
                            <option value="h_nur">Vrchní sestra</option>
                            <option value="d_nur">Staniční sestra</option>
                            <option value="instrum">Instrumentář/ka</option>
                            <option value="midwife">Porodní asistentka</option>                            
                            <!-- <option value="nurse">Sestra</option>                             -->
                            <option value="other">Jiné</option>

                        </select>

                    </div>

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Position
                        </label> -->

                        <select id="pos2" class="form-select">

                            <option value="">Vyberte doplňkovou pracovní pozici</option>
                            <!-- <option value="p_doc">Primář/ka</option>
                            <option value="doc">Lékař/ka</option> -->
                            <option value="h_nur">Vrchní sestra</option>
                            <option value="d_nur">Staniční sestra</option>
                            <option value="instrum">Instrumentář/ka</option>
                            <option value="midwife">Porodní asistentka</option>                            
                            <!-- <option value="nurse">Sestra</option>                             -->
                            <option value="other">Jiné</option>

                        </select>

                    </div>

                    
                </div>

                <!-- FAVORITE -->

                <div class="section-title">Oblíbení kolegové/yně (budou preferováni při rozepisování do směnách)</div>
                

                <div class="row g-2">

                    <div class="col-12 col-md-6">
                        <select id="favorite1" class="form-select">
                            <option value="">Oblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite2" class="form-select">
                            <option value="">Oblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite3" class="form-select">
                            <option value="">Oblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite4" class="form-select">
                            <option value="">Oblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                <!-- UNFAVORITE -->

                <div class="section-title">Neoblíbení kolegové/yně (nebudou se vám přiřazovat do směn)</div>
                

                <div class="row g-2">

                    <div class="col-12 col-md-6">
                        <select id="unfavorite1" class="form-select">
                            <option value="">Neoblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite2" class="form-select">
                            <option value="">Neoblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite3" class="form-select">
                            <option value="">Neoblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite4" class="form-select">
                            <option value="">Neoblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                
                <!-- BUTTONS -->
            <div class="row mb-3">  </div>
                <div class="row g-2">
                    <div class="col-12 col-md-6">

                        <button
                            type="button" class="btn btn-royal w-100" onclick="registerUser()">
                            Registrovat se
                        </button>

                    </div>

                    <div class="col-12 col-md-6">
                        <a href="index.html" class="btn btn-outline-success w-100">
                            Zpět na přihlášení
                        </a>

                    </div>

                </div>

                <div
                    id="msg"
                    class="text-center mt-3">
                </div>

            </div>

        </div>

    </div>

</div>
<!-- Modal -->
<div class="modal fade" id="errorModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">Chyba</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div id="errorModalText"></div>

            </div>

            <div class="modal-footer">

                <button
                    type="button" class="btn btn-royal" data-bs-dismiss="modal">
                    OK
                </button>

            </div>

        </div>

    </div>

</div>

<script
    type="module"
    src="js/register.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
