<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <!-- language="cs" is not valid in HTML5, use lang="cs" instead -->
    <html lang="cs">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>denní:noční</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="./img/favicon_letter.ico">

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon_letter_16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon_letter_32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="./img/favicon_letter_48.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon_letter_180.png">

    <!-- Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="./img/favicon_letter_192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./img/favicon_letter_512.png">

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#1565C0">

</head>

<body>
    <!-- Menu button -->
    


  <div id="appContent">
    

  </div>



<!-- Modal -->
<div class="modal fade" id="genericModal" tabindex="-1">

    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">
                <h5 class="modal-title" id="modalTitle"></h5>
                <!-- <button type="button" class="btn-close" id="modalClose" data-bs-dismiss="modal">
                </button> -->
            </div>

            <div class="modal-body">
                <div id="modalText"></div>
            </div>

            <div class="modal-footer">
                <button id="modalOk" type="button" class="btn" data-bs-dismiss="modal">                    OK
                </button>
            </div>
        </div>
    </div>
</div>






<div class="modal fade" id="choiceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="choiceModalTitle" class="modal-title">Výběr</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div id="choiceModalBody" class="modal-body">
            </div>

            <div class="modal-footer">
                <button id="choiceModalOk" type="button" class="btn btn-blue-darker w-100 mb-2">
                    OK
                </button>
                <button id="choiceModalCancel" type="button" class="btn btn-blue-green-white w-100 mb-2">
                    Zrušit
                </button>

            </div>

        </div>
    </div>
</div>





<!-- <script type="module" src="js/auth.js"></script> -->
<script type="module" src="./js/app.js"></script>
<script src="js/modalDialog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- event listener for modal close on Enter key -->
<script>
document.getElementById("genericModal").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        document.getElementById("modalOk").click();
    }
});
</script>

<!-- Menu off canvas -->
 <div
    class="offcanvas offcanvas-start c-blue-dark"
    tabindex="-1"
    id="appMenu">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">&nbsp;</h5>
        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">

        <button
            class="btn btn-blue-no-border w-100 mb-2"
            data-action="fShowUserProfileFromMenu"
            data-bs-dismiss="offcanvas">
            Můj profil
        </button>

        <button
            class="btn btn-blue-no-border w-100 mb-2"
            data-action="fShowUserRequestsFromMenu"
            data-bs-dismiss="offcanvas">
            Moje požadavky
        </button>

        <button
            class="btn btn-red-no-border w-100"
            data-action="fLogout"
            data-bs-dismiss="offcanvas">
            Odhlásit
        </button>

    </div>
</div>
</body>
