<div id="pageProfile" class="app-page">
  <div class="container-fluid page-container">
    
    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto">

                <h1 class="text-center mb-0" style="font-size: 3rem;">
                    <span style="color: var(--blue-dark);">denní</span><span style="color: var(--blue-middle);">:</span><span style="color: var(--blue-green);">noční</span>
                </h1>
               <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                  </h6>

                <h2 class="c-blue-darker text-center mb-4" data-text="profileTitle">
                    Profil
                </h2>

                
                <!-- NAME -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-2">

                        <!-- <label class="form-label">
                            Prefix
                        </label> -->

                        <input id="prefix" class="form-control" placeholder="Titul před jménem" data-field="prefix">

                    </div>

                    <div class="col-12 col-md-4">

                        <!-- <label class="form-label">
                            Given name
                        </label> -->

                        <input id="givenname" class="form-control" placeholder="Jméno" data-field="givenname">

                    </div>

                    <div class="col-12 col-md-4">

                        <!-- <label class="form-label">
                            Surname
                        </label> -->

                        <input id="surname" class="form-control" placeholder="Příjmení" data-field="surname">

                    </div>

                    <div class="col-12 col-md-2">

                        <!-- <label class="form-label">
                            Suffix
                        </label> -->

                        <input id="suffix" class="form-control" placeholder="Titul za jménem" data-field="suffix">

                    </div>

                </div>

                <!-- PHONE -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Telefonní číslo
                        </label> -->

                        <input
                            id="phone"
                            class="form-control"
                            placeholder="Telefonní číslo"
                            data-field="phone">

                    </div>

                

                    <div class="col-12 col-md-6">

                        <!-- <label class="form-label">
                            Shortname
                        </label> -->

                        <input id="shortname" class="form-control"
                            placeholder="Zkrácené jméno pro zobrazování ve směnách (max. 5 znaků)"
                            data-field="shortname">

                    </div>

                </div>

                <!-- POSITION -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">

                        <label class="form-label">Oddělení</label>

                        <select id="department" class="form-select" data-field="dctDepartments" placeholder="Vyberte oddělení">
                            <!-- <option value="">Vyberte oddělení</option>
                            <option value="ApoBr">VFN-Apolinář</option>
                            <option value="Xxxxx">Jiné</option> -->
                        </select>

                    </div>
                    
                    <div class="col-12 col-md-6">

                        <label class="form-label">Preferované pracoviště</label>

                        <select id="pref_spot" class="form-select" data-field="dctSpots" placeholder="Vyberte preferované pracoviště">

                            <!-- <option value="">Vyberte preferovaný sál</option>
                            <option value="room0">Je mi to jedno</option>
                            <option value="room1">Porodní centrum</option>
                            <option value="room2">2. porodní sál</option> -->
                            
                        </select>

                    </div>
                </div>
                <div class="row g-2 mb-3">


                    <div class="col-12 col-md-6">

                        <label class="form-label section-title">Pracovní pozice</label>
                        <select id="pos1" class="form-select" data-field="dctPositions" placeholder="Vyberte první pozici">
                        </select>

                    </div>

                    <div class="col-12 col-md-6">

                        <label class="form-label section-title">Pracovní pozice 2</label>
                        <select id="pos2" class="form-select" data-field="dctPositions" placeholder="Vyberte druhou pozici">
                        </select>

                    </div>

                    
                </div>

                <!-- FAVORITE -->

                <div class="section-title">Oblíbení kolegové/yně (budou preferováni při rozepisování do směnách)</div>
                

                <div class="row g-2">

                    <div class="col-12 col-md-6">
                        <select id="favorite1" class="form-select" data-field="dctEmployees" placeholder="Vyberte oblíbeného kolegu/yni 1">
                            <option value="">Oblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite2" class="form-select" data-field="dctEmployees" placeholder="Vyberte oblíbeného kolegu/yni 2">
                            <option value="">Oblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite3" class="form-select" data-field="dctEmployees" placeholder="Vyberte oblíbeného kolegu/yni 3">
                            <option value="">Oblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite4" class="form-select" data-field="dctEmployees" placeholder="Vyberte oblíbeného kolegu/yni 4">
                            <option value="">Oblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                <!-- UNFAVORITE -->

                <div class="section-title">Neoblíbení kolegové/yně (nebudou se vám přiřazovat do směn)</div>
                

                <div class="row g-2">

                    <div class="col-12 col-md-6">
                        <select id="unfavorite1" class="form-select" data-field="dctEmployees" placeholder="Vyberte neoblíbeného kolegu/yni 1">
                            <option value="">Neoblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite2" class="form-select" data-field="dctEmployees" placeholder="Vyberte neoblíbeného kolegu/yni 2">
                            <option value="">Neoblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite3" class="form-select" data-field="dctEmployees" placeholder="Vyberte neoblíbeného kolegu/yni 3">
                            <option value="">Neoblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite4" class="form-select" data-field="dctEmployees" placeholder="Vyberte neoblíbeného kolegu/yni 4">
                            <option value="">Neoblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                
                <!-- BUTTONS -->
            <div class="row mb-3">  </div>
                <div class="row g-2">
                    <div class="col-12 col-md-6">

                        <button
                            type="button" class="btn btn-blue-darker w-100 mb-2" data-action="fSaveUserProfile">
                            Uložit
                        </button>

                    </div>
                    <div class="col-12 col-md-6">
                    <button
                        type="button" class="btn btn-blue-green-white w-100 mb-2" data-action="fShowLogin">
                        Zpět na přihlášení
                    </button>

                    </div>

                </div>

                <div
                    id="msg"
                    class="text-center mt-3">
                </div>

            </div>

        </div>

    </div>

</div>
