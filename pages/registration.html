<div id="pageRegistration" class="app-page"></div>
  <div class="container-fluid page-container">

    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto">

                <h1 class="text-center mb-0" style="font-size: 3rem;">
                    <span style="color: var(--blue-dark);">denní</span><span style="color: var(--blue-middle);">:</span><span style="color: var(--blue-green);">noční</span>
                </h1>
               <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                  </h6>

                <h2 class="c-blue-darker text-center mb-4">
                    Registrace pro předregistrované uživatele
                </h2>
                
                <!-- <h6 class="text-center mb-4 italic c-blue-darker">
                    Pokud jste předregistrovaný uživatel, můžete si zde nastavit nebo změnit své heslo.
                    <br>
                    Po zadání emailu a hesla vám přijde odkaz pro potvrzení registrace na váš email. Pokud neobdržíte email, zkontrolujte složku spamu nebo se obraťte na administrátora.
                    <br>
                    v 3.6.2026 12.12
                </h6> -->

                <!-- EMAIL -->
                <div class="section-title c-blue-darker">Email (pouze předregistrovaný)</div>
                <div class="row mb-3">

                    <div class="col-12">

                        <!-- <label class="form-label">Email</label> -->
                        <input id="email" type="email" class="form-control mb-3 c-blue-darker col-md-12"
                        data-value="email">
                        <!-- <input id="email" type="email" class="form-control"> -->
                        <!-- <div class="form-text">Email musí být ve formátu @vfn.cz.</div> -->

                    </div>

                </div>
                <!-- PASSWORD -->

                <div class="section-title c-blue-darker">Heslo (min. 8 znaků), obě pole musí být shodná</div>

                <div class="row g-2 mb-4">

                    <div class="col-12 col-md-6">
                      <!-- <label class="form-label">Heslo</label> -->

                        <div class="input-group">
                        <input id="password" type="password" class="form-control c-blue-darker" placeholder="Heslo"
                             data-value="password" value="test1234">

                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password', this)">
                            👁
                        </button>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                         <!-- <label class="form-label">Heslo znovu</label> -->
                    <div class="input-group">
                        <input id="password2" type="password" class="form-control c-blue-darker" placeholder="Heslo znovu"
                             data-value="password2" value="test1234">

                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password2', this)">
                            👁
                        </button>
                        </div>
                    </div>

                </div>

                <!-- BUTTONS -->
            <div class="row mb-3">  </div>
                <div class="row g-2">
                    <div class="col-12 col-md-6">

                        <button
                            type="button" class="btn btn-blue-darker w-100" id="btnRegister" data-action="fRegister">
                            Dokončit registraci
                        </button>

                    </div>

                    <div class="col-12 col-md-6">
                        <button
                            type="button" class="btn btn-blue-green-white w-100 mb-2" data-action="fShowLogin">
                            Zpět na přihlášení
                        </button>

                    </div>

                </div>

                <div
                    id="msg"
                    class="text-center mt-3">
                </div>

            </div>

        </div>

    </div>

</div>
</div>
