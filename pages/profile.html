<div id="pageProfile" class="app-page">
  <div class="container-fluid page-container">
    
    <div class="row justify-content-center">

        <div class="col-12 col-xl-10">

            <div class="card card-auth p-4 p-md-5 mx-auto">

                <h1 class="text-center mb-0" style="font-size: 3rem;">
                    <span style="color: var(--blue-dark);">denní</span><span style="color: var(--blue-middle);">:</span><span style="color: var(--blue-green);">noční</span>
                </h1>
                <!-- <h6 class="text-center mb-4 c-blue-darker">
                    Vaše směny pod kontrolou
                </h6> -->
                <h6 class="text-center mb-4 c-blue-darker"  data-text="profileTitle2">
                </h6>

                <h2 class="c-blue-darker text-center mb-4" data-text="profileTitle">
                    Profil
                </h2>

                <!-- NAME -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-2">

                        <label class="form-label section-title c-blue-darker">Titul před</label>

                        <input id="prefix" class="form-control" placeholder="Titul před" data-value="prefix">

                    </div>

                    <div class="col-12 col-md-4">

                        <label class="form-label section-title c-blue-darker">Jméno</label>
                        <input id="givenname" class="form-control" placeholder="Jméno" data-value="givenname">

                    </div>

                    <div class="col-12 col-md-4">

                        <label class="form-label section-title c-blue-darker">Příjmení</label>
                        <input id="surname" class="form-control" placeholder="Příjmení" data-value="surname">

                    </div>

                    <div class="col-12 col-md-2">

                        <label class="form-label section-title c-blue-darker">Titul za</label>

                        <input id="suffix" class="form-control" placeholder="Titul za" data-value="suffix">

                    </div>

                </div>

                <!-- PHONE -->

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker">Telefonní číslo</label>
                        <input id="phone" class="form-control" placeholder="Telefonní číslo" data-value="phone">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label section-title  c-blue-darker">Zkrácené jméno (cca 5 znaků)</label>
                        <input id="shortname" class="form-control"
                            placeholder="Zkrácené jméno pro zobrazování ve směnách (max. 5 znaků)"
                            data-value="shortname">
                    </div>

                </div>

                <!-- POSITION -->

                <div class="row g-2 mb-3">

                    <!-- <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker">Oddělení</label>
                        <select id="department" class="form-select" data-options="dctDepartments" data-value="department" placeholder="Vyberte oddělení">
                        </select>
                    </div> -->
                    
                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker">Preferované pracoviště</label>
                        <select id="pref_spot" class="form-select" data-options="dctSpots" data-value="pref_spot" placeholder="Vyberte preferované pracoviště">
                        </select>
                    </div>

                </div>

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker">Hlavní pracovní pozice</label>
                        <select id="pos1" class="form-select" data-options="dctPositions" data-value="pos" placeholder="Vyberte první pozici">
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label section-title c-blue-darker">Vedlejší pracovní pozice</label>
                        <select id="pos2" class="form-select" data-options="dctPositions" data-value="pos2" placeholder="Vyberte druhou pozici">
                        </select>
                    </div>
                    
                </div>

                <!-- DEPUTIES -->

                <div class="section-title c-blue-darker" data-visible="role=Mngr">Zástupci (mají podobná práva jako vy)</div>
                

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">
                        <select id="deputy1" class="form-select" data-options="dctEmplWoThis" data-value="deputy_1" placeholder="Vyberte zástupce 1">
                            <option value="">Zástupce 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="deputy2" class="form-select" data-options="dctEmplWoThis" data-value="deputy_2" placeholder="Vyberte zástupce 2">
                            <option value="">Zástupce 2</option>
                        </select>
                    </div>
                </div>

                <!-- favorite_ -->

                <div class="section-title c-blue-darker">Oblíbení kolegové/yně (budou preferováni při rozepisování do směnách)</div>

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">
                        <select id="favorite_1" class="form-select" 
                        data-options="dctEmplWoThis" data-value="favorite_1"
                        placeholder="Vyberte oblíbeného kolegu/yni 1">
                            <option value="">Oblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite_2" class="form-select" data-options="dctEmplWoThis" data-value="favorite_2" placeholder="Vyberte oblíbeného kolegu/yni 2">
                            <option value="">Oblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite_3" class="form-select" data-options="dctEmplWoThis" data-value="favorite_3" placeholder="Vyberte oblíbeného kolegu/yni 3">
                            <option value="">Oblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="favorite_4" class="form-select" data-options="dctEmplWoThis" data-value="favorite_4" placeholder="Vyberte oblíbeného kolegu/yni 4">
                            <option value="">Oblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                <!-- UNfavorite_ -->

                <div class="section-title c-blue-darker">Neoblíbení kolegové/yně (nebudou se vám přiřazovat do směn)</div>
                

                <div class="row g-2 mb-3">

                    <div class="col-12 col-md-6">
                        <select id="unfavorite_1" class="form-select" data-options="dctEmplWoThis" data-value="unfavorite_1" placeholder="Vyberte neoblíbeného kolegu/yni 1">
                            <option value="">Neoblíbený kolega/yně 1</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite_2" class="form-select" data-options="dctEmplWoThis" data-value="unfavorite_2" placeholder="Vyberte neoblíbeného kolegu/yni 2">
                            <option value="">Neoblíbený kolega/yně 2</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite_3" class="form-select" data-options="dctEmplWoThis" data-value="unfavorite_3" placeholder="Vyberte neoblíbeného kolegu/yni 3">
                            <option value="">Neoblíbený kolega/yně 3</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <select id="unfavorite_4" class="form-select" data-options="dctEmplWoThis" data-value="unfavorite_4" placeholder="Vyberte neoblíbeného kolegu/yni 4">
                            <option value="">Neoblíbený kolega/yně 4</option>
                        </select>
                    </div>

                </div>

                
                <!-- BUTTONS -->
            <div class="row mb-3">  </div>
                <div class="row g-2">
                    <div class="col-12 col-md-6">

                        <button type="button" class="btn btn-blue-darker w-100 mb-2" data-action="fSaveEmployeeProfile">
                            Uložit
                        </button>

                    </div>
                    <div class="col-12 col-md-6">
                    <button type="button" class="btn btn-blue-green-white w-100 mb-2" data-action="fShowLogin"> 
                        Zpět na přihlášení
                    </button>

                    </div>

                </div>

                <div
                    id="msg"
                    class="text-center mt-3">
                </div>

            </div>

        </div>

    </div>

</div>
