<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firestore Playground</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="card mx-auto" style="max-width: 900px;">
        <div class="card-body">

            <h1 class="h4 mb-3">Firestore Playground</h1>

            <div id="testForm" class="row g-3 mb-3">

                <div class="col-12 col-md-4">
                    <label class="form-label">Collection</label>
                    <input id="collectionName" data-field="collectionName" class="form-control" value="employees">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label">Key / document ID</label>
                    <input id="key" data-field="key" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label">Field</label>
                    <input id="field" data-field="field" class="form-control" value="email">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label">Value</label>
                    <input id="value" data-field="value" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label">Name</label>
                    <input id="name" data-field="name" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label">Phone</label>
                    <input id="phone" data-field="phone" class="form-control">
                </div>

            </div>

            <div class="d-grid gap-2 d-md-flex mb-3">
                <button id="btnGetCollection" class="btn btn-primary">1. Get collection</button>
                <button id="btnGetByKey" class="btn btn-secondary">2. Get by key</button>
                <button id="btnGetByField" class="btn btn-secondary">3. Get by field</button>
                <button id="btnGetFormData" class="btn btn-warning">4. Get form data</button>
                <button id="btnSetData" class="btn btn-success">5. Set data</button>
            </div>

            <pre id="output" class="bg-dark text-white p-3 rounded" style="min-height: 250px;"></pre>

        </div>
    </div>

</div>

<script type="module" src="./js/playground.js"></script>

</body>
</html>
